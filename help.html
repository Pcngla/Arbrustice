<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Help Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: 'Georgia', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #leaf {
      width: 80px;
      margin-bottom: 20px;
      animation: glow 3s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 12px gold);
    }

    @keyframes glow {
      from { transform: scale(1); opacity: 0.8; }
      to   { transform: scale(1.05); opacity: 1; }
    }

    .message {
      font-size: 1.2em;
      max-width: 80%;
      line-height: 1.5em;
      opacity: 0.9;
    }

    #back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      filter: drop-shadow(0 0 10px red);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #back-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <img id="leaf" src="leaf.png" alt="Help Leaf">

  <div class="message">
    Welcome, traveler.<br><br>
    This is the Help Room of Arbrustice.<br>
    Soon, you'll find access to our products, CV, and contact options here.
  </div>

  <a href="index.html">
    <img id="back-btn" src="leaf.png" alt="Back to homepage">
  </a>

</body>
</html>
