<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Help Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }

    .help-leaf {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: auto;
      z-index: 10;
      animation: glow 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 12px gold);
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px gold); }
      50% { filter: drop-shadow(0 0 20px gold); }
    }

    #back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 0 10px lime);
      z-index: 20;
    }

    #back-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- help leaf icon -->
  <img src="leaf.png" alt="Help Leaf" class="help-leaf">

  <!-- back to home -->
  <a href="index.html">
    <img id="back-btn" src="leaf.png" alt="Back">
  </a>

</body>
</html>
