<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: black url('background.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .apple-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 230px;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    .apple-container img {
      width: 100%;
      filter: drop-shadow(0 0 20px crimson);
    }

    #back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      cursor: pointer;
      filter: drop-shadow(0 0 10px crimson);
      transition: transform 0.3s ease;
    }

    #back-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <audio id="wind-sound" src="wind.mp3" autoplay></audio>

  <div class="apple-container">
    <img src="obsidian_apple_shake_FINAL.gif" alt="Obsidian Apple">
  </div>

  <a href="index.html" onclick="document.getElementById('wind-sound').play()">
    <img id="back-btn" src="leaf.png" alt="Back">
  </a>
</body>
</html>
