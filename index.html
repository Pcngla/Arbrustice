<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: black;
      overflow: hidden;
    }

    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .click-zone {
      position: absolute;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
    }

    .click-zone:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
    }

    /* Portal Positions */
    #bonsai-btn {
      top: 60%;
      left: 10%;
      width: 80px;
    }

    #apple-btn {
      top: 55%;
      right: 8%;
      width: 70px;
    }

    #help-btn {
      top: 10%;
      right: 20%;
      width: 50px;
    }

    #orchard-btn {
      bottom: 10%;
      left: 45%;
      width: 65px;
    }

    /* Optional mobile favicon animation */
    link[rel="icon"] {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 1px crimson); }
      50% { filter: drop-shadow(0 0 6px crimson); }
      100% { filter: drop-shadow(0 0 1px crimson); }
    }
  </style>
</head>
<body>

  <!-- Bonsai Portal -->
  <a href="bonsai/bonsai.html">
    <img id="bonsai-btn" class="click-zone" src="heart.png" alt="bonsai portal">
  </a>

  <!-- Apple Portal -->
  <a href="apple.html">
    <img id="apple-btn" class="click-zone" src="spiral.png" alt="apple portal">
  </a>

  <!-- Help Portal -->
  <a href="help.html">
    <img id="help-btn" class="click-zone" src="leaf.png" alt="help portal">
  </a>

  <!-- Orchard Portal -->
  <a href="orchard/index.html">
    <img id="orchard-btn" class="click-zone" src="triangle.png" alt="orchard portal">
  </a>

</body>
</html>
