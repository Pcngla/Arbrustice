<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: black;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }.zone {
  position: absolute;
  width: 80px;
  height: 80px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.5s ease;
}

#apple-zone {
  top: 715px;
  left: 895px;
  width: 230px;
  height: 230px;
}

#apple-animation {
  position: absolute;
  top: 715px;
  left: 895px;
  width: 230px;
  height: 230px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

a:hover #apple-animation,
a:active #apple-animation {
  opacity: 1;
}

#heart-zone {
  top: 42%;
  left: 10%;
  width: 80px;
  height: 80px;
  z-index: 3;
}
#triangle-zone { top: 32%; right: 12%; }
#leaf-zone {
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
}

  </style>
</head>
<body>  <!-- Obsidian Apple Zone -->  <a href="apple.html">
    <div id="apple-zone" class="zone"></div>
    <img id="apple-animation" src="obsidian_apple_shake_FINAL.gif" alt="apple effect">
  </a>  <!-- Bonsai Portal (Heart) -->  <a href="bonsai/index.html">
    <div id="heart-zone" class="zone"></div>
  </a>  <!-- Other portals -->  <a href="designs/index.html">
    <div id="triangle-zone" class="zone"></div>
  </a>  <a href="orchard/index.html">
    <div id="leaf-zone" class="zone"></div>
  </a></body>
</html>
