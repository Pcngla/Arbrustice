<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }.zone {
  position: absolute;
  width: 80px;
  height: 80px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.5s ease;
}

/* Obsidian apple animation container */
#apple-animation {
  position: absolute;
  top: 715px;
  left: 895px;
  width: 230px;
  height: 230px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.zone:hover + #apple-animation,
.zone:active + #apple-animation {
  opacity: 1;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

#heart-zone { top: 46%; left: 14%; }
#spiral-zone { top: 59%; left: 42%; }
#triangle-zone { top: 32%; right: 12%; }
#leaf-zone {
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
}

  </style>
</head>
<body>  <!-- Obsidian Apple Zone -->  <a href="apple.html">
    <div class="zone" style="top: 715px; left: 895px; width: 230px; height: 230px;"></div>
  </a>
  <img id="apple-animation" src="obsidian_apple_shake_FINAL.gif" alt="apple effect">  <!-- Other portals (invisible zone style) -->  <a href="bonsai/index.html">
    <div id="heart-zone" class="zone"></div>
  </a>  <a href="designs/index.html">
    <div id="triangle-zone" class="zone"></div>
  </a>  <a href="orchard/index.html">
    <div id="leaf-zone" class="zone"></div>
  </a></body>
</html>
