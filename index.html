<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: black;
    }

    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
    }

    .click-zone {
      position: absolute;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .click-zone:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px gold);
    }

    /* Bonsai (Heart) */
    #bonsai-btn {
      top: 60%;
      left: 10%;
      width: 80px;
    }

    /* Ruby Apple (Spiral) */
    #apple-btn {
      top: 55%;
      right: 8%;
      width: 70px;
    }

    /* Help Leaf */
    #help-btn {
      top: 10%;
      right: 20%;
      width: 50px;
    }
  </style>
</head>
<body>

  <!-- Bonsai Portal -->
  <a href="bonsai.html">
    <img id="bonsai-btn" class="click-zone" src="heart.png" alt="bonsai portal">
  </a>

  <!-- Apple Portal -->
  <a href="apple.html">
    <img id="apple-btn" class="click-zone" src="spiral.png" alt="apple portal">
  </a>

  <!-- Help Portal -->
  <a href="help.html">
    <img id="help-btn" class="click-zone" src="leaf.png" alt="help portal">
  </a>

</body>
</html>
