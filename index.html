<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }.zone {
  position: absolute;
  width: 80px;
  height: 80px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.zone:hover::after,
.zone:active::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  animation: pulse 1s ease;
  opacity: 1;
}

#heart-zone:hover::after, #heart-zone:active::after {
  background-image: url('heart.png');
}
#spiral-zone:hover::after, #spiral-zone:active::after {
  background-image: url('spiral.png');
}
#triangle-zone:hover::after, #triangle-zone:active::after {
  background-image: url('triangle.png');
}
#leaf-zone:hover::after, #leaf-zone:active::after {
  background-image: url('leaf.png');
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

/* Specific positioning above background elements */
#heart-zone { top: 46%; left: 14%; }
#spiral-zone { top: 59%; left: 42%; }
#triangle-zone { top: 32%; right: 12%; }
#leaf-zone { bottom: 7%; left: 50%; transform: translateX(-50%); }

  </style>
</head>
<body>  <a href="bonsai/index.html">
    <div id="heart-zone" class="zone"></div>
  </a>  <a href="apple.html">
    <div id="spiral-zone" class="zone"></div>
  </a>  <a href="designs/index.html">
    <div id="triangle-zone" class="zone"></div>
  </a>  <a href="orchard/index.html">
    <div id="leaf-zone" class="zone"></div>
  </a></body>
</html>
