<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }.portal {
  position: absolute;
  width: 60px;
  transition: transform 0.3s ease, filter 0.3s ease;
  filter: drop-shadow(0 0 5px #880000);
  animation: pulse 4s ease-in-out infinite;
}

.portal:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 15px crimson);
}

@keyframes pulse {
  0%, 100% { filter: drop-shadow(0 0 5px #880000); }
  50% { filter: drop-shadow(0 0 12px red); }
}

#heart { top: 28%; left: 15%; }
#spiral { top: 40%; left: 45%; }
#triangle { top: 28%; right: 15%; }
#leaf {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
}

  </style>
</head>
<body>  <!-- Glowing clickable icons only -->  <a href="bonsai/index.html">
    <img id="heart" class="portal" src="heart.png" alt="Heart">
  </a>  <a href="apple.html">
    <img id="spiral" class="portal" src="spiral.png" alt="Apple">
  </a>  <a href="designs/index.html">
    <img id="triangle" class="portal" src="triangle.png" alt="Triangle">
  </a>  <a href="orchard/index.html">
    <img id="leaf" class="portal" src="leaf.png" alt="Leaf">
  </a></body>
</html>
