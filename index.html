<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }.portal {
  position: absolute;
  width: 60px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.portal:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 12px red);
}

#heart { top: 28%; left: 15%; }
#spiral { top: 40%; left: 45%; }
#triangle { top: 28%; right: 15%; }
#leaf { bottom: 20px; left: 50%; transform: translateX(-50%); width: 50px; }

.label {
  position: absolute;
  color: violet;
  font-family: Georgia, serif;
  font-size: 14px;
  text-shadow: 0 0 6px black;
}

#label-heart { top: 42%; left: 15%; }
#label-spiral { top: 55%; left: 45%; }
#label-triangle { top: 42%; right: 15%; }
#label-leaf { bottom: 5%; left: 50%; transform: translateX(-50%); }

  </style>
</head>
<body>  <!-- Portals -->  <a href="bonsai/index.html">
    <img id="heart" class="portal" src="heart.png" alt="Heart">
  </a>
  <div id="label-heart" class="label">bonsai portal</div>  <a href="apple.html">
    <img id="spiral" class="portal" src="spiral.png" alt="Apple">
  </a>
  <div id="label-spiral" class="label">apple portal</div>  <a href="designs/index.html">
    <img id="triangle" class="portal" src="triangle.png" alt="Triangle">
  </a>
  <div id="label-triangle" class="label">designs portal</div>  <a href="orchard/index.html">
    <img id="leaf" class="portal" src="leaf.png" alt="Leaf">
  </a>
  <div id="label-leaf" class="label">orchard portal</div></body>
</html>
