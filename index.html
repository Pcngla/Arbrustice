<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arbrustice</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .click-zone {
      position: absolute;
      width: 60px;
      height: 60px;
      z-index: 10;
    }

    /* Positioning zones */
    #bonsai-zone {
      top: 24%;
      left: 28%;
    }

    #designs-zone {
      top: 23%;
      right: 23%;
    }

    #orchard-zone {
      bottom: 8%;
      left: 46%;
    }

    #apple-zone {
      bottom: 16%;
      right: 18%;
      width: 80px;
      height: 80px;
    }

    /* Glowing visible HELP leaf */
    #help-leaf {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 45px;
      height: auto;
      z-index: 20;
      animation: pulse 2s infinite;
      filter: drop-shadow(0 0 8px orange);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <!-- Click Zones -->
  <a href="bonsai/index.html" class="click-zone" id="bonsai-zone"></a>
  <a href="designs/index.html" class="click-zone" id="designs-zone"></a>
  <a href="orchard/index.html" class="click-zone" id="orchard-zone"></a>
  <a href="apple.html" class="click-zone" id="apple-zone"></a>

  <!-- Visible Help Button -->
  <a href="help.html">
    <img id="help-leaf" src="leaf.png" alt="Help">
  </a>
</body>
</html>
