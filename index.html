<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: black;
    }

    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .click-zone {
      position: absolute;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .click-zone:hover {
      transform: scale(1.07);
      filter: drop-shadow(0 0 12px gold);
    }

    /* Portal positions */
    #bonsai-btn {
      top: 60%;
      left: 10%;
      width: 80px;
    }

    #apple-btn {
      top: 55%;
      right: 8%;
      width: 70px;
    }

    #help-btn {
      top: 10%;
      right: 20%;
      width: 50px;
    }

    #orchard-btn {
      bottom: 10%;
      left: 45%;
      width: 65px;
    }
  </style>
</head>
<body>

  <!-- Bonsai Room -->
  <a href="bonsai/bonsai.html">
    <img id="bonsai-btn" class="click-zone" src="heart.png" alt="bonsai portal">
  </a>

  <!-- Apple Room -->
  <a href="apple.html">
    <img id="apple-btn" class="click-zone" src="spiral.png" alt="apple portal">
  </a>

  <!-- Help Room -->
  <a href="help.html">
    <img id="help-btn" class="click-zone" src="leaf.png" alt="help portal">
  </a>

  <!-- Orchard Room -->
  <a href="orchard/index.html">
    <img id="orchard-btn" class="click-zone" src="triangle.png" alt="orchard portal">
  </a>

</body>
</html>
