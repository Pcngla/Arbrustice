<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbrustice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    a {
      position: absolute;
      display: block;
      width: 60px;
      height: 60px;
      transition: transform 0.3s ease;
    }
    a img {
      width: 100%;
      height: auto;
      opacity: 0;
    }
    a:hover img {
      opacity: 1;
      transform: scale(1.2);
    }
    /* Invisible zones over the symbols in background.jpg */
    #bonsai {
      top: 25%; left: 30%; /* Heart */
    }
    #designs {
      top: 25%; right: 30%; /* Triangle */
    }
    #apple {
      bottom: 20%; left: 50%; transform: translateX(-50%); /* Obsidian heart apple */
    }
    #orchard {
      bottom: 5%; left: 50%; transform: translateX(-50%); /* Leaf */
    }
  </style>
</head>
<body>
  <a id="bonsai" href="bonsai/index.html"><img src="heart.png" alt="bonsai"></a>
  <a id="designs" href="designs/index.html"><img src="triangle.png" alt="designs"></a>
  <a id="apple" href="apple.html"><img src="spiral.png" alt="apple"></a>
  <a id="orchard" href="orchard/index.html"><img src="leaf.png" alt="orchard"></a>
</body>
</html>
