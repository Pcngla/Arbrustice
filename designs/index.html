<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Designs Portal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: 100vw;
  height: 100vh;
  position: absolute;
}

.cell {
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease;
}

.cell:hover {
  background: rgba(255, 255, 255, 0.05);
}

.cell img {
  width: 50px;
  height: 50px;
  transition: transform 0.4s ease, filter 0.4s ease;
}

.cell:nth-child(1):hover img {
  transform: scale(1.2) rotate(5deg);
  filter: drop-shadow(0 0 5px red);
}
.cell:nth-child(2):hover img {
  transform: scale(1.4) rotate(-5deg);
  filter: hue-rotate(90deg);
}
.cell:nth-child(3):hover img {
  transform: scale(1.1);
  filter: brightness(150%);
}
.cell:nth-child(4):hover img {
  transform: translateY(-10px);
  filter: sepia(80%);
}
.cell:nth-child(5):hover img {
  transform: scale(1.3) rotate(360deg);
  filter: drop-shadow(0 0 8px cyan);
}
.cell:nth-child(6):hover img {
  transform: scale(1.1) rotate(15deg);
  filter: contrast(200%);
}
.cell:nth-child(7):hover img {
  transform: translateX(10px);
  filter: grayscale(100%);
}
.cell:nth-child(8):hover img {
  transform: scale(1.2) rotate(-15deg);
  filter: invert(1);
}
.cell:nth-child(9):hover img {
  transform: scale(1.5);
  filter: saturate(3);
}

  </style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="../heart.png" alt="icon" /></div>
    <div class="cell"><img src="../spiral.png" alt="icon" /></div>
    <div class="cell"><img src="../triangle.png" alt="icon" /></div>
    <div class="cell"><img src="../leaf.png" alt="icon" /></div>
    <div class="cell"><img src="../heart.png" alt="icon" /></div>
    <div class="cell"><img src="../spiral.png" alt="icon" /></div>
    <div class="cell"><img src="../triangle.png" alt="icon" /></div>
    <div class="cell"><img src="../leaf.png" alt="icon" /></div>
    <div class="cell"><img src="../heart.png" alt="icon" /></div>
  </div>
</body>
</html>
