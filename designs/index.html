<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Designs Portal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #000000 0%, #0b0b0b 100%);
      font-family: 'Segoe UI', sans-serif;
    }.neon-frame {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80vw;
  height: 60vh;
  border: 3px solid rgba(255, 0, 255, 0.7);
  box-shadow: 0 0 20px magenta, 0 0 40px purple;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2.5s infinite ease-in-out;
  backdrop-filter: blur(3px);
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.05); }
}

h1 {
  color: white;
  font-size: 3em;
  text-shadow: 0 0 10px fuchsia, 0 0 20px magenta;
  animation: glow 3s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px magenta; }
  to { text-shadow: 0 0 20px violet, 0 0 30px magenta; }
}

a.back {
  position: absolute;
  bottom: 30px;
  left: 30px;
  color: gold;
  font-weight: bold;
  text-decoration: none;
  font-size: 1.2em;
  background: rgba(255, 255, 255, 0.05);
  padding: 10px 20px;
  border: 1px solid gold;
  border-radius: 8px;
  transition: background 0.3s, transform 0.3s;
}

a.back:hover {
  background: gold;
  color: black;
  transform: scale(1.1);
}

  </style>
</head>
<body>
  <div class="neon-frame">
    <h1>Designs Portal</h1>
  </div>
  <a class="back" href="../index.html">Return to Bonsai</a>
</body>
</html>
