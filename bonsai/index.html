<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bonsai Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100vh;
      overflow: hidden;
      background-image: url('../background.jpg');
      background-size: cover;
      background-position: center;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }@keyframes fadeIn {
  to { opacity: 1; }
}

.rune {
  position: absolute;
  width: 60px;
  height: 60px;
  animation: rotate 6s linear infinite;
  filter: drop-shadow(0 0 12px crimson);
  opacity: 0;
  transition: opacity 1s ease;
}

.rune.visible {
  opacity: 1;
}

#rune1 { top: 25%; left: 50%; transform: translate(-50%, -50%); }
#rune2 { top: 50%; left: 75%; transform: translate(-50%, -50%); }
#rune3 { top: 75%; left: 50%; transform: translate(-50%, -50%); }
#rune4 { top: 50%; left: 25%; transform: translate(-50%, -50%); }

@keyframes rotate {
  0% { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}

.loader-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  animation: fadeOut 2s ease 3s forwards;
}

.loader-icon {
  position: absolute;
  width: 50px;
  height: 50px;
  animation: spin 3s linear infinite;
}

.loader-icon:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
.loader-icon:nth-child(2) { top: 50%; left: 100%; transform: translateY(-50%); }
.loader-icon:nth-child(3) { top: 100%; left: 50%; transform: translate(-50%, -100%); }
.loader-icon:nth-child(4) { top: 50%; left: 0%; transform: translateY(-50%); }

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

#back-btn {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 50px;
  cursor: pointer;
  filter: drop-shadow(0 0 10px gold);
  transition: transform 0.3s ease;
  opacity: 0;
}

#back-btn.visible {
  opacity: 1;
}

#back-btn:hover {
  transform: scale(1.1);
}

  </style>
</head>
<body>  <div class="loader-container" id="loader">
    <img class="loader-icon" src="../heart.png" alt="rune">
    <img class="loader-icon" src="../spiral.png" alt="rune">
    <img class="loader-icon" src="../triangle.png" alt="rune">
    <img class="loader-icon" src="../leaf.png" alt="rune">
  </div>  <img id="rune1" class="rune" src="../triangle.png" alt="rune">
  <img id="rune2" class="rune" src="../spiral.png" alt="rune">
  <img id="rune3" class="rune" src="../heart.png" alt="rune">
  <img id="rune4" class="rune" src="../leaf.png" alt="rune">  <a href="../index.html">
    <img id="back-btn" src="../leaf.png" alt="Back">
  </a>  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelectorAll('.rune').forEach(el => el.classList.add('visible'));
        document.getElementById('back-btn').classList.add('visible');
      }, 3000);
    });
  </script></body>
</html>
